<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media queries</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            padding: 5px;
            background-color: darkseagreen;
        }
        @media screen and(min-width: 300px) {
            .box{
                background-color: aqua;
            }
            
        }
    </style>
</head>
<body>
    <div class="box">Box1</div>
</body>
</html>
