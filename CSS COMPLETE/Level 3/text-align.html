<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text align</title>
    <style>
        #box1{
            height: 100px;
            width: 100px;
            background-color: chartreuse;
            text-align: center;
        }
        #box2{
            height: 100px;
            width: 100px;
            background-color: chartreuse;
            text-align: right;
        }

    </style>
</head>
<body>
    <div id="box1">box1</div><br>
    <div id="box2">box2</div>
</body>
</html>
