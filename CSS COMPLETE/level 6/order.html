<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-shrink</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            height: 75px;
            width: 75px;
            margin: 3px;
            border : 3px solid black;
            text-align: center;
        }
        #heading{ margin-left: 200px;}
        #container{
            height: 400px;
            width: 600px;
            padding: 10px;
            margin: 20px;
            border: 3px solid black;
            display: flex;
            justify-content: center;
           
            
        }
        #box1{ background-color: aqua;
                order: 4;
            }
        #box2{ background-color: blueviolet;
                order: 3; 
            }
        #box3{background-color: chartreuse;
            order: 2;
            }
        #box4{ background-color: darkcyan;
            order: 1;
            }
        
    </style>
    

</head>
<body>
    <h1 id="heading"> flex container</h1>
    <div id="container">
        <div id="box1" class="box"> flex box1</div>
        <div id="box2" class="box"> flex box2</div>
        <div id="box3" class="box"> flex box3</div>
        <div id="box4" class="box"> flex box4</div>
        
        
    </div>
</body>
</html>
