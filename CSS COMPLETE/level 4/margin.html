<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin property</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        #padded{
            height: 50px;
            width: 50px;
            padding: 2px;
            margin: 5px 20px 15px 25px;
            background-color: slateblue;

        }
    </style>
</head>
<body>
    <div id="padded">margin property</div>
</body>
</html>
