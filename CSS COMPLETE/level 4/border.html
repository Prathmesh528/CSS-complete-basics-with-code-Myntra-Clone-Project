<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        #button{
            background-color: aqua;
            height: 50px;
            width: 50px;
            padding: 10px;
            border: 5px solid coral;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div id="button">click me
    </div>
</body>
</html>
