<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes</title>
    <style>
        .Pseudo{
            height: 50px;
            width: 150px;
            background-color: rgb(72, 93, 72);
            border: 2px solid black;
            border-radius: 5px;
        }
        .Pseudo:hover{
            height: 70px;
            width: 200px;
            background-color: aquamarine;
        }
        .Pseudo:active{
            height: 70px;
            width: 200px;
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <button class="Pseudo"> learning Pseudo</button>
</body>
</html>
